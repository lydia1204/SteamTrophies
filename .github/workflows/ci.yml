name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install exact dependencies
        if: matrix.os != 'macos-latest'
        run: npm ci

      - name: Install exact dependencies without unsupported Starlight lifecycle on macOS
        if: matrix.os == 'macos-latest'
        run: npm ci --ignore-scripts

      - name: Prepare Starlight tooling
        if: matrix.os != 'macos-latest'
        run: npm run prepare

      - name: Offline engineering gate
        run: npm run release:validate

      - name: Decky Python syntax
        run: python -m compileall -q decky

  package:
    name: Production package smoke test
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Lua compiler
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install exact dependencies
        run: npm ci

      - name: Prepare Starlight tooling
        run: npm run prepare

      - name: Validate Lua backend syntax
        run: npm run lua:validate

      - name: Build package
        run: mkdir -p dist && npm run styles:generate && npx starlight --release --of ./dist pack

      - name: Verify staged package
        run: npx starlight verify ./dist/dev.steamtrophies.client.star

      - name: Preserve tested candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamtrophies-candidate
          path: dist/dev.steamtrophies.client.star
          if-no-files-found: error
