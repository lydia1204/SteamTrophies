name: Bug report
description: Report a reproducible SteamTrophies issue without sharing private account data.
body:
  - type: markdown
    attributes:
      value: |
        Please check the README troubleshooting section first. This is an experimental candidate.
        Never attach account tokens, complete Steam logs, personal trophy state, or vulnerability exploit details.
        Use SECURITY.md for sensitive reports.
  - type: input
    id: version
    attributes:
      label: Plugin version or commit
      placeholder: 0.4.0-rc.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, Steam build/channel, Millennium or Decky version/revision; game App ID if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected result
      description: List the steps, expected behavior, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Redacted screenshots or small log excerpts. For UI include scaling/theme/input; for notifications say whether Steam's own overlay works and include recent delivery diagnostics.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account credentials, session tokens and unrelated personal data from this report.
          required: true
