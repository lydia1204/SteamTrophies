[plugin]
id = "dev.steamtrophies.client"
name = "Steam Trophies"
version = "0.4.0-rc.2"
author = "Scarlett / Lydia + contributors"
description = "PlayStation-style Steam trophies with rarity-driven tiers, fast cached browsing, and synthetic Platinum trophies."

[assets]
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webkit/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix = "TROPHY:BCK"
frontend_prefix = "TROPHY:FRT"
webview_prefix = "TROPHY:WEB"

[patches]
debug = true
